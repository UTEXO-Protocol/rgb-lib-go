name: Watch upstream rgb-lib

# Scheduled workflows only fire from the default branch (main).
# Use workflow_dispatch to run manually from any release/* branch.
on:
  schedule:
    # Check every 6 hours so a new upstream release is picked up within hours.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update (default: release/upstream)'
        required: false
        default: 'release/upstream'
        type: string

jobs:
  bump-submodule:
    name: Bump rgb-lib submodule to latest upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve target branch
        id: meta
        run: |
          BRANCH="${{ inputs.target_branch || 'release/upstream' }}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Get latest upstream release tag and commit SHA
        id: upstream
        run: |
          TAG=$(gh api repos/RGB-Tools/rgb-lib/releases \
            --jq '[.[] | select(.draft == false)] | .[0].tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No releases found upstream, nothing to do"
            exit 0
          fi
          echo "Latest upstream release: $TAG"

          # Resolve tag to commit SHA (handles both lightweight and annotated tags)
          REF=$(gh api "repos/RGB-Tools/rgb-lib/git/refs/tags/$TAG" --jq '.object | {sha, type}')
          SHA=$(echo "$REF" | jq -r '.sha')
          TYPE=$(echo "$REF" | jq -r '.type')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api "repos/RGB-Tools/rgb-lib/git/tags/$SHA" --jq '.object.sha')
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG → $SHA"

      - name: Checkout target branch with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.branch }}
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if submodule is already at this tag
        id: check
        run: |
          TARGET_SHA="${{ steps.upstream.outputs.sha }}"
          CURRENT_SHA=$(git -C rgb-lib rev-parse HEAD)
          if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
            echo "Already at ${{ steps.upstream.outputs.tag }} ($CURRENT_SHA) — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Current: ${CURRENT_SHA:0:8}  →  target: ${{ steps.upstream.outputs.tag }} (${TARGET_SHA:0:8})"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update submodule pointer to upstream tag
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          git -C rgb-lib fetch --tags
          git -C rgb-lib checkout "tags/$TAG"
          git add rgb-lib

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Submodule pointer unchanged — nothing to push"
          else
            git commit -m "chore: bump rgb-lib submodule to upstream $TAG"
            git push origin HEAD:$BRANCH
          fi
