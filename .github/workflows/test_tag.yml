name: Test Library (tag)

on:
  workflow_run:
    workflows: ["Build and Release"]
    types:
      - completed
    branches:
      - 'release/*'

  workflow_dispatch:
    inputs:
      version:
        description: "rgb-lib-go tag to test (e.g., v0.3.0-beta.7). Leave empty for latest."
        required: false
        type: string

jobs:
  test:
    name: Test tag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Only run when the upstream build succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            lib_name: librgblibuniffi.so
          - os: macos-latest
            goos: darwin
            goarch: arm64
            lib_name: librgblibuniffi.dylib

    steps:
      - name: Checkout release/upstream
        uses: actions/checkout@v4
        with:
          ref: release/upstream

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get rgb-lib-go version to test
        id: go_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(gh api repos/${{ github.repository }}/releases \
              --jq '[.[] | select(.draft == false)] | .[0].tag_name')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Testing rgb-lib-go version: ${VERSION}"

      - name: Download native library from rgb-lib-go release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.go_version.outputs.version }}"
          ASSET="rgb-lib-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip"

          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --output /tmp/rgb-lib-go.zip

          mkdir -p lib
          unzip -o /tmp/rgb-lib-go.zip "lib/${{ matrix.lib_name }}" -d /tmp/extracted
          cp /tmp/extracted/lib/${{ matrix.lib_name }} lib/
          file lib/${{ matrix.lib_name }}

      - name: Build Go package
        run: |
          export CGO_ENABLED=1
          go mod tidy
          go build ./...

      - name: Use tagged rgb-lib-go for testing
        working-directory: lib_test
        env:
          GOPROXY: direct
          GONOSUMCHECK: github.com/UTEXO-Protocol/rgb-lib-go
          GONOSUMDB: github.com/UTEXO-Protocol/rgb-lib-go
        run: |
          go mod edit -dropreplace github.com/UTEXO-Protocol/rgb-lib-go || true
          sed -i.bak '/github.com\/UTEXO-Protocol\/rgb-lib-go/d' go.sum
          go get github.com/UTEXO-Protocol/rgb-lib-go@${{ steps.go_version.outputs.version }}
          go mod tidy

      - name: Run lib_test
        working-directory: lib_test
        env:
          BITCOIN_NETWORK: signet
          MNEMONIC: ${{ secrets.TEST_MNEMONIC }}
          ACCOUNT_XPUB_VANILLA: ${{ secrets.TEST_ACCOUNT_XPUB_VANILLA }}
          ACCOUNT_XPUB_COLORED: ${{ secrets.TEST_ACCOUNT_XPUB_COLORED }}
          MASTER_FINGERPRINT: ${{ secrets.TEST_MASTER_FINGERPRINT }}
          INDEXER_URL: ${{ secrets.TEST_INDEXER_URL }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/lib
          CGO_ENABLED: 1
          CGO_LDFLAGS: -L${{ github.workspace }}/lib -lrgblibuniffi
        run: make run
