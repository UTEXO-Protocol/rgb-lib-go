name: Build and Release

on:
  # Rebuild when submodule pointer is updated on this branch
  push:
    branches:
      - release/upstream
    paths:
      - '.gitmodules'
      - 'rgb-lib'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to commit bindings to'
        required: false
        default: 'release/upstream'
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # uniffi-bindgen-go compatible with uniffi 0.32
  UNIFFI_BINDGEN_GO_GIT: "https://github.com/kixelated/uniffi-bindgen-go.git"
  UNIFFI_BINDGEN_GO_REV: "4f79e52bd8f518e5fa4d7acff9e586aee21e12a0"

jobs:
  generate:
    name: Generate Go bindings (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      submodule_sha: ${{ steps.submodule.outputs.sha }}
      upstream_tag: ${{ steps.submodule.outputs.tag }}
      target_branch: ${{ steps.meta.outputs.target_branch }}
    steps:
      - name: Resolve target branch
        id: meta
        run: |
          BRANCH="${{ inputs.branch || 'release/upstream' }}"
          echo "target_branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.target_branch }}
          submodules: recursive

      - name: Record submodule metadata
        id: submodule
        run: |
          SHA=$(git -C rgb-lib rev-parse --short HEAD)
          TAG=$(git -C rgb-lib describe --tags --exact-match 2>/dev/null || echo "")
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building rgb-lib @ ${SHA} (upstream tag: ${TAG:-<untagged>})"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rgb-lib/bindings/uniffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rgb-lib/bindings/uniffi/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build rgb-lib uniffi (linux/amd64)
        working-directory: rgb-lib/bindings/uniffi
        run: cargo build --release

      - name: Install uniffi-bindgen-go
        run: |
          cargo install --git "${{ env.UNIFFI_BINDGEN_GO_GIT }}" \
            --rev "${{ env.UNIFFI_BINDGEN_GO_REV }}" uniffi-bindgen-go

      - name: Generate Go bindings
        run: |
          (cd rgb-lib/bindings/uniffi && uniffi-bindgen-go src/rgb-lib.udl --out-dir /tmp/go-bindings)

          GO_FILE=$(find /tmp/go-bindings -name "rgb_lib.go" | head -1)
          H_FILE=$(find /tmp/go-bindings  -name "rgb_lib.h"  | head -1)

          if [ -z "$GO_FILE" ] || [ -z "$H_FILE" ]; then
            echo "ERROR: Generated files not found"
            exit 1
          fi

          cp "$GO_FILE" rgb_lib.go
          cp "$H_FILE"  rgb_lib.h

      - name: Add CGo LDFLAGS to preamble
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("rgb_lib.go"); s = p.read_text()
          old = '// #include <rgb_lib.h>\nimport "C"'
          new = ('/*\n#cgo LDFLAGS: -lrgblibuniffi -L${SRCDIR}/lib -Wl,-rpath,${SRCDIR}/lib\n'
                 '#include <rgb_lib.h>\n*/\nimport "C"')
          assert s.count(old) == 1, f"unexpected cgo preamble:\n{s[:500]}"
          p.write_text(s.replace(old, new))
          PY

      - name: Collect linux/amd64 native library
        run: |
          mkdir -p lib
          cp rgb-lib/bindings/uniffi/target/release/librgblibuniffi.so lib/librgblibuniffi.so
          file lib/librgblibuniffi.so

      - name: Commit bindings and linux/amd64 library
        run: |
          SHA="${{ steps.submodule.outputs.sha }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rgb_lib.go rgb_lib.h lib/librgblibuniffi.so
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bindings and linux/amd64 native lib from rgb-lib ${SHA}"
            git push origin HEAD:${{ steps.meta.outputs.target_branch }}
          fi

  build-native:
    name: Build native (${{ matrix.target }})
    needs: generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            lib_name: librgblibuniffi.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            lib_name: librgblibuniffi_arm64.so
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            goos: darwin
            goarch: arm64
            lib_name: librgblibuniffi.dylib

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.target_branch }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rgb-lib/bindings/uniffi/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rgb-lib/bindings/uniffi/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build native library from source
        working-directory: rgb-lib/bindings/uniffi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect native library
        run: |
          mkdir -p lib
          SRC="rgb-lib/bindings/uniffi/target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "${SRC}/librgblibuniffi.dylib" lib/
            install_name_tool -id @rpath/librgblibuniffi.dylib lib/librgblibuniffi.dylib
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cp "${SRC}/librgblibuniffi.so" lib/librgblibuniffi_arm64.so
          else
            cp "${SRC}/librgblibuniffi.so" lib/librgblibuniffi.so
          fi
          file lib/${{ matrix.lib_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go package
        if: "!matrix.cross"
        run: |
          export CGO_ENABLED=1
          go build ./...

      - name: Package artifact
        run: |
          mkdir -p dist/lib
          cp lib/${{ matrix.lib_name }} dist/lib/
          cp rgb_lib.go rgb_lib.h go.mod README.md dist/
          cd dist && zip -r ../rgb-lib-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgb-lib-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rgb-lib-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          retention-days: 5

  publish:
    name: Commit all platform libs and publish GitHub Release
    needs: [generate, build-native]
    # Only when the submodule is pinned to a tagged upstream release
    if: needs.generate.outputs.upstream_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all native library artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Commit arm64 and darwin libs to branch
        run: |
          git pull --rebase origin ${{ needs.generate.outputs.target_branch }}
          mkdir -p lib

          unzip -o /tmp/artifacts/rgb-lib-go-linux-arm64/rgb-lib-go-linux-arm64.zip \
            'lib/librgblibuniffi_arm64.so' -d /tmp/extracted-arm64
          unzip -o /tmp/artifacts/rgb-lib-go-darwin-arm64/rgb-lib-go-darwin-arm64.zip \
            'lib/librgblibuniffi.dylib' -d /tmp/extracted-darwin

          cp /tmp/extracted-arm64/lib/librgblibuniffi_arm64.so lib/
          cp /tmp/extracted-darwin/lib/librgblibuniffi.dylib   lib/

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/librgblibuniffi_arm64.so lib/librgblibuniffi.dylib
          if git diff --cached --quiet; then
            echo "libs already up to date"
          else
            UPSTREAM_TAG="${{ needs.generate.outputs.upstream_tag }}"
            git commit -m "chore: add arm64/darwin native libs from rgb-lib ${UPSTREAM_TAG}"
            git push origin HEAD:${{ needs.generate.outputs.target_branch }}
          fi

      - name: Skip if release already exists
        id: release_check
        run: |
          TAG="v${{ needs.generate.outputs.upstream_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release $TAG already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag and GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        run: |
          UPSTREAM_TAG="${{ needs.generate.outputs.upstream_tag }}"
          TAG="v${UPSTREAM_TAG}"

          git pull --rebase origin ${{ needs.generate.outputs.target_branch }}
          git tag -a "$TAG" -m "rgb-lib-go built from upstream RGB-Tools/rgb-lib ${UPSTREAM_TAG}"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "rgb-lib-go ${TAG}" \
            --notes "Go bindings for [RGB-Tools/rgb-lib ${UPSTREAM_TAG}](https://github.com/RGB-Tools/rgb-lib/releases/tag/${UPSTREAM_TAG}).

**Platforms:**
- \`linux/amd64\` — \`librgblibuniffi.so\`
- \`linux/arm64\` — \`librgblibuniffi_arm64.so\`
- \`darwin/arm64\` — \`librgblibuniffi.dylib\`" \
            --prerelease \
            /tmp/artifacts/rgb-lib-go-linux-amd64/rgb-lib-go-linux-amd64.zip \
            /tmp/artifacts/rgb-lib-go-linux-arm64/rgb-lib-go-linux-arm64.zip \
            /tmp/artifacts/rgb-lib-go-darwin-arm64/rgb-lib-go-darwin-arm64.zip
