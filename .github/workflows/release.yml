name: Build and Release

on:
  # Triggered by rgb-lib or rgb-lib-bfa via repository_dispatch
  repository_dispatch:
    types: [rgb-lib-release, rgb-lib-bfa-release]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      rgb_lib_version:
        description: 'rgb-lib version to use (e.g., v0.3.0-beta.4) — download mode only'
        required: false
        type: string
      source_repo:
        description: 'Source repository — download mode only'
        required: false
        default: 'rgb-lib'
        type: choice
        options:
          - rgb-lib
          - rgb-lib-bfa
      branch:
        description: 'Branch to commit bindings to (auto-selected if empty)'
        required: false
        type: string
      source_sha:
        description: 'Commit SHA in the rgb-lib submodule to build from — enables submodule build mode (builds from source instead of downloading a mirrored release)'
        required: false
        type: string
      tag:
        description: 'New git tag to create on the resulting commit — required in submodule build mode'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # rgb-lib builds on uniffi 0.32; NordSecurity has no matching release yet, so the
  # generator comes from their open PR #98 (a 0.31 bindgen produces bindings the
  # 0.32 library rejects at load with "UniFFI API checksum mismatch").
  UNIFFI_BINDGEN_GO_GIT: "https://github.com/kixelated/uniffi-bindgen-go.git"
  UNIFFI_BINDGEN_GO_REV: "4f79e52bd8f518e5fa4d7acff9e586aee21e12a0"

jobs:
  mode:
    name: Resolve build mode
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.decide.outputs.mode }}
    steps:
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.source_sha }}" ]; then
            echo "mode=submodule" >> "$GITHUB_OUTPUT"
          else
            echo "mode=download" >> "$GITHUB_OUTPUT"
          fi

  generate:
    name: Generate Go bindings
    needs: mode
    if: needs.mode.outputs.value == 'download'
    runs-on: warp-ubuntu-latest-x64-4x
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      source_repo: ${{ steps.ctx.outputs.source_repo }}
      version: ${{ steps.ctx.outputs.version }}
    steps:
      - name: Resolve build context
        id: ctx
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            SOURCE_REPO="${{ github.event.client_payload.source_repo }}"
            SOURCE_REPO="${SOURCE_REPO:-rgb-lib}"
            VERSION="${{ github.event.client_payload.version }}"
            PAYLOAD_BRANCH="${{ github.event.client_payload.branch }}"
          else
            SOURCE_REPO="${{ inputs.source_repo }}"
            SOURCE_REPO="${SOURCE_REPO:-rgb-lib}"
            VERSION="${{ inputs.rgb_lib_version }}"
            PAYLOAD_BRANCH="${{ inputs.branch }}"
          fi

          if [ "$SOURCE_REPO" == "rgb-lib-bfa" ]; then
            DEFAULT_BRANCH="release/bfa"
          else
            DEFAULT_BRANCH="release/custom-bfa"
          fi
          BRANCH="${PAYLOAD_BRANCH:-$DEFAULT_BRANCH}"

          VERSION="${VERSION#v}"
          VERSION="v${VERSION}"

          echo "source_repo=$SOURCE_REPO" >> $GITHUB_OUTPUT
          echo "version=$VERSION"         >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"           >> $GITHUB_OUTPUT
          echo "Source: $SOURCE_REPO  Version: $VERSION  Branch: $BRANCH"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.branch }}

      - name: Set up SSH for rgb-lib-bfa (private repo)
        if: steps.ctx.outputs.source_repo == 'rgb-lib-bfa'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.RGB_LIB_BFA_DEPLOY_KEY }}" > ~/.ssh/rgb_lib_bfa_key
          chmod 600 ~/.ssh/rgb_lib_bfa_key
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-rgb-lib-bfa
            HostName github.com
            User git
            IdentityFile ~/.ssh/rgb_lib_bfa_key
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config
          git config --global \
            "url.ssh://git@github-rgb-lib-bfa/UTEXO-Protocol/rgb-lib-bfa.insteadOf" \
            "https://github.com/UTEXO-Protocol/rgb-lib-bfa"
        shell: bash

      - name: Clone source rgb-lib at release tag
        run: |
          git clone --depth 1 --branch ${{ steps.ctx.outputs.version }} \
            https://github.com/UTEXO-Protocol/${{ steps.ctx.outputs.source_repo }}.git /tmp/rgb-lib-src
        shell: bash

      # When source is rgb-lib-bfa, uniffi-bindgen-go runs cargo metadata on the
      # cloned repo, which tries to fetch [patch.crates-io] deps from private
      # rgb-tools-devs SSH URLs → rewrite them to HTTPS+PAT.
      - name: Configure private RGB upstream access (rgb-lib-bfa)
        if: steps.ctx.outputs.source_repo == 'rgb-lib-bfa'
        env:
          RGB_UPSTREAM_TOKEN: ${{ secrets.RGB_UPSTREAM_TOKEN }}
        run: |
          for r in rgb-consensus rgb-ops rgb-api rgb-schemas; do
            git config --global \
              url."https://x-access-token:${RGB_UPSTREAM_TOKEN}@github.com/UTEXO-Protocol/${r}-s-bfa.git".insteadOf \
              "ssh://git@github.com/rgb-tools-devs/${r}.git"
          done
        shell: bash

      # Only needed when building from rgb-lib (private BFA deps via [patch.crates-io])
      - name: Set up SSH for private BFA deps
        if: steps.ctx.outputs.source_repo == 'rgb-lib'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.RGB_CONSENSUS_BFA_DEPLOY_KEY }}" > ~/.ssh/key_consensus
          printf '%s\n' "${{ secrets.RGB_OPS_BFA_DEPLOY_KEY }}"       > ~/.ssh/key_ops
          printf '%s\n' "${{ secrets.RGB_SCHEMAS_BFA_DEPLOY_KEY }}"   > ~/.ssh/key_schemas
          chmod 600 ~/.ssh/key_*
          cat >> ~/.ssh/config << 'SSHCONF'
          Host github-rgb-consensus
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_consensus
            IdentitiesOnly yes
          Host github-rgb-ops
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_ops
            IdentitiesOnly yes
          Host github-rgb-schemas
            HostName github.com
            User git
            IdentityFile ~/.ssh/key_schemas
            IdentitiesOnly yes
          SSHCONF
          chmod 600 ~/.ssh/config
          git config --global \
            "url.ssh://git@github-rgb-consensus/UTEXO-Protocol/rgb-consensus-s-bfa.insteadOf" \
            "https://github.com/UTEXO-Protocol/rgb-consensus-s-bfa"
          git config --global \
            "url.ssh://git@github-rgb-ops/UTEXO-Protocol/rgb-ops-s-bfa.insteadOf" \
            "https://github.com/UTEXO-Protocol/rgb-ops-s-bfa"
          git config --global \
            "url.ssh://git@github-rgb-schemas/UTEXO-Protocol/rgb-schemas-s-bfa.insteadOf" \
            "https://github.com/UTEXO-Protocol/rgb-schemas-s-bfa"
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uniffi-bindgen-go
        run: |
          cargo install --git "${{ env.UNIFFI_BINDGEN_GO_GIT }}" \
            --rev "${{ env.UNIFFI_BINDGEN_GO_REV }}" uniffi-bindgen-go
        shell: bash

      - name: Generate bindings
        working-directory: /tmp/rgb-lib-src
        run: |
          CONFIG_FLAG=""
          if [ -f bindings/uniffi/uniffi.toml ]; then
            CONFIG_FLAG="--config bindings/uniffi/uniffi.toml"
          fi

          uniffi-bindgen-go bindings/uniffi/src/rgb-lib.udl \
            --out-dir /tmp/go-bindings \
            $CONFIG_FLAG

          echo "Generated files:"
          find /tmp/go-bindings -type f

          GO_FILE=$(find /tmp/go-bindings -name "rgb_lib.go" | head -1)
          H_FILE=$(find /tmp/go-bindings -name "rgb_lib.h" | head -1)

          if [ -z "$GO_FILE" ] || [ -z "$H_FILE" ]; then
            echo "ERROR: Generated files not found"
            exit 1
          fi

          cp "$GO_FILE" $GITHUB_WORKSPACE/rgb_lib.go
          cp "$H_FILE" $GITHUB_WORKSPACE/rgb_lib.h
        shell: bash

      # cgo only reads the comment directly above `import "C"`, so the LDFLAGS
      # go into the preamble bindgen emits, not above `package`.
      - name: Add CGo LDFLAGS to the preamble
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("rgb_lib.go"); s = p.read_text()
          old = '// #include <rgb_lib.h>\nimport "C"'
          new = ('/*\n#cgo LDFLAGS: -lrgblibuniffi -L${SRCDIR}/lib -Wl,-rpath,${SRCDIR}/lib\n'
                 '#include <rgb_lib.h>\n*/\nimport "C"')
          assert s.count(old) == 1, "unexpected cgo preamble in generated rgb_lib.go"
          p.write_text(s.replace(old, new))
          PY
        shell: bash

      - name: Download native libraries
        env:
          GH_TOKEN: ${{ secrets.RGB_LIB_BFA_READ_PAT }}
        run: |
          mkdir -p lib
          rm -f lib/librgblibuniffi*

          REPO="UTEXO-Protocol/${{ steps.ctx.outputs.source_repo }}"
          TAG="${{ steps.ctx.outputs.version }}"

          gh release download "$TAG" --repo "$REPO" \
            --pattern "rgb-lib-uniffi-x86_64-unknown-linux-gnu.zip" \
            --output /tmp/linux-x64.zip
          unzip -o /tmp/linux-x64.zip -d /tmp/linux-x64
          cp /tmp/linux-x64/librgblibuniffi.so lib/librgblibuniffi.so

          gh release download "$TAG" --repo "$REPO" \
            --pattern "rgb-lib-uniffi-aarch64-unknown-linux-gnu.zip" \
            --output /tmp/linux-arm64.zip
          unzip -o /tmp/linux-arm64.zip -d /tmp/linux-arm64
          cp /tmp/linux-arm64/librgblibuniffi.so lib/librgblibuniffi_arm64.so

          gh release download "$TAG" --repo "$REPO" \
            --pattern "rgb-lib-uniffi-aarch64-apple-darwin.zip" \
            --output /tmp/macos-arm64.zip
          unzip -o /tmp/macos-arm64.zip -d /tmp/macos-arm64
          cp /tmp/macos-arm64/librgblibuniffi.dylib lib/librgblibuniffi.dylib

          echo "=== Verifying library architectures ==="
          file lib/*
          file lib/librgblibuniffi.so | grep -q "x86-64" || { echo "ERROR: librgblibuniffi.so is not x86-64"; exit 1; }
          file lib/librgblibuniffi_arm64.so | grep -q "aarch64\|ARM aarch64" || { echo "ERROR: librgblibuniffi_arm64.so is not aarch64"; exit 1; }
          file lib/librgblibuniffi.dylib | grep -q "arm64\|aarch64" || { echo "ERROR: librgblibuniffi.dylib is not arm64"; exit 1; }
          echo "All libraries verified OK"
        shell: bash

      - name: Commit updated bindings and libraries
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rgb_lib.go rgb_lib.h lib/
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "Auto-generate Go bindings and update native libs from ${{ steps.ctx.outputs.source_repo }} ${{ steps.ctx.outputs.version }}"
            git push origin HEAD:${{ steps.ctx.outputs.branch }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        shell: bash

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: [mode, generate]
    if: needs.mode.outputs.value == 'download'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: warp-ubuntu-latest-x64-4x
            goos: linux
            goarch: amd64
            lib_name: librgblibuniffi.so
          - target: aarch64-apple-darwin
            os: warp-macos-26-arm64-6x
            goos: darwin
            goarch: arm64
            lib_name: librgblibuniffi.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download rgb-lib uniffi library
        env:
          GH_TOKEN: ${{ secrets.RGB_LIB_BFA_READ_PAT }}
        run: |
          mkdir -p lib
          gh release download "${{ needs.generate.outputs.version }}" \
            --repo "UTEXO-Protocol/${{ needs.generate.outputs.source_repo }}" \
            --pattern "rgb-lib-uniffi-${{ matrix.target }}.zip" \
            --output rgb-lib-uniffi.zip
          unzip -o rgb-lib-uniffi.zip -d lib/
          ls -la lib/
        shell: bash

      - name: Fix library path (macOS)
        if: runner.os == 'macOS'
        run: |
          install_name_tool -id @rpath/librgblibuniffi.dylib lib/librgblibuniffi.dylib

      - name: Build and test Go package
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/lib -lrgblibuniffi"
          go mod tidy
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
        shell: bash

      - name: Package artifacts
        run: |
          mkdir -p dist/lib
          cp lib/${{ matrix.lib_name }} dist/lib/
          cp rgb_lib.go dist/
          cp rgb_lib.h dist/
          cp go.mod dist/
          cp README.md dist/
          cd dist && zip -r ../rgb-lib-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip .
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgb-lib-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: rgb-lib-go-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          retention-days: 5

  release:
    name: Create Release
    needs: [mode, generate, build]
    if: needs.mode.outputs.value == 'download'
    runs-on: warp-ubuntu-latest-x64-4x
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.zip" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate.outputs.version }}
          name: Release ${{ needs.generate.outputs.version }}
          target_commitish: ${{ needs.generate.outputs.sha }}
          body: |
            ## Go bindings for ${{ needs.generate.outputs.source_repo }}

            Based on ${{ needs.generate.outputs.source_repo }} ${{ needs.generate.outputs.version }}

            ### Installation

            ```go
            go get github.com/UTEXO-Protocol/rgb-lib-go@${{ needs.generate.outputs.version }}
            ```

            ### Platforms

            - Linux x64 (`linux-amd64`)
            - macOS ARM64 / Apple Silicon (`darwin-arm64`)

            ### Changes

            See [${{ needs.generate.outputs.source_repo }} release notes](https://github.com/UTEXO-Protocol/${{ needs.generate.outputs.source_repo }}/releases/tag/${{ needs.generate.outputs.version }})
          draft: false
          prerelease: ${{ contains(needs.generate.outputs.version, 'alpha') || contains(needs.generate.outputs.version, 'beta') || contains(needs.generate.outputs.version, 'rc') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Submodule build mode: builds Go bindings and native libraries directly from
  # a commit in the rgb-lib submodule (e.g. an upstream PR branch not yet
  # released), instead of downloading pre-built assets from a mirrored
  # release. Commits bindings + all native libs in one commit and tags it.
  sub-meta:
    name: Resolve submodule build context
    needs: mode
    if: needs.mode.outputs.value == 'submodule'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.ctx.outputs.branch }}
      source_sha: ${{ steps.ctx.outputs.source_sha }}
      tag: ${{ steps.ctx.outputs.tag }}
    steps:
      - id: ctx
        shell: bash
        run: |
          BRANCH="${{ inputs.branch }}"
          echo "branch=${BRANCH:-release/upstream}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${{ inputs.source_sha }}" >> "$GITHUB_OUTPUT"
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::'tag' input is required in submodule build mode"
            exit 1
          fi
          echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

  sub-bindings:
    name: Generate Go bindings (submodule)
    needs: sub-meta
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sub-meta.outputs.branch }}
          submodules: recursive

      - name: Pin submodule to target commit
        run: |
          git -C rgb-lib fetch --depth 1 origin ${{ needs.sub-meta.outputs.source_sha }}
          git -C rgb-lib checkout ${{ needs.sub-meta.outputs.source_sha }}
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uniffi-bindgen-go
        run: |
          cargo install --git "${{ env.UNIFFI_BINDGEN_GO_GIT }}" \
            --rev "${{ env.UNIFFI_BINDGEN_GO_REV }}" uniffi-bindgen-go
        shell: bash

      - name: Generate bindings
        working-directory: rgb-lib/bindings/uniffi
        run: |
          CONFIG_FLAG=""
          if [ -f uniffi.toml ]; then
            CONFIG_FLAG="--config uniffi.toml"
          fi

          uniffi-bindgen-go src/rgb-lib.udl \
            --out-dir /tmp/go-bindings \
            $CONFIG_FLAG

          GO_FILE=$(find /tmp/go-bindings -name "rgb_lib.go" | head -1)
          H_FILE=$(find /tmp/go-bindings -name "rgb_lib.h" | head -1)

          if [ -z "$GO_FILE" ] || [ -z "$H_FILE" ]; then
            echo "ERROR: Generated files not found"
            exit 1
          fi

          cp "$GO_FILE" "$GITHUB_WORKSPACE/rgb_lib.go"
          cp "$H_FILE" "$GITHUB_WORKSPACE/rgb_lib.h"
        shell: bash

      - name: Add CGo LDFLAGS to the preamble
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("rgb_lib.go"); s = p.read_text()
          old = '// #include <rgb_lib.h>\nimport "C"'
          new = ('/*\n#cgo LDFLAGS: -lrgblibuniffi -L${SRCDIR}/lib -Wl,-rpath,${SRCDIR}/lib\n'
                 '#include <rgb_lib.h>\n*/\nimport "C"')
          assert s.count(old) == 1, "unexpected cgo preamble in generated rgb_lib.go"
          p.write_text(s.replace(old, new))
          PY
        shell: bash

      - name: Upload bindings artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-bindings
          path: |
            rgb_lib.go
            rgb_lib.h
          retention-days: 1

  sub-build-native:
    name: Build native (${{ matrix.target }})
    needs: sub-meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: warp-ubuntu-latest-x64-4x
            lib_name: librgblibuniffi.so
            dest_name: librgblibuniffi.so
          - target: aarch64-unknown-linux-gnu
            os: warp-ubuntu-latest-x64-4x
            lib_name: librgblibuniffi.so
            dest_name: librgblibuniffi_arm64.so
            cross: true
          - target: aarch64-apple-darwin
            os: warp-macos-26-arm64-6x
            lib_name: librgblibuniffi.dylib
            dest_name: librgblibuniffi.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sub-meta.outputs.branch }}
          submodules: recursive

      - name: Pin submodule to target commit
        run: |
          git -C rgb-lib fetch --depth 1 origin ${{ needs.sub-meta.outputs.source_sha }}
          git -C rgb-lib checkout ${{ needs.sub-meta.outputs.source_sha }}
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu
        shell: bash

      - name: Build native library
        working-directory: rgb-lib/bindings/uniffi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Collect native library
        run: |
          mkdir -p out
          SRC="rgb-lib/bindings/uniffi/target/${{ matrix.target }}/release/${{ matrix.lib_name }}"
          cp "$SRC" "out/${{ matrix.dest_name }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            install_name_tool -id @rpath/librgblibuniffi.dylib "out/${{ matrix.dest_name }}"
          fi
          file "out/${{ matrix.dest_name }}"
        shell: bash

      - name: Upload native library artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: out/${{ matrix.dest_name }}
          retention-days: 1

  sub-finalize:
    name: Commit bindings, libraries and tag
    needs: [sub-meta, sub-bindings, sub-build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sub-meta.outputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Pin submodule to target commit
        run: |
          git -C rgb-lib fetch --depth 1 origin ${{ needs.sub-meta.outputs.source_sha }}
          git -C rgb-lib checkout ${{ needs.sub-meta.outputs.source_sha }}
          git add rgb-lib
        shell: bash

      - name: Download bindings artifact
        uses: actions/download-artifact@v4
        with:
          name: go-bindings
          path: .

      - name: Download native library artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: lib
          merge-multiple: true

      - name: Verify native libraries
        run: |
          ls -la lib/
          file lib/librgblibuniffi.so | grep -q "x86-64" || { echo "ERROR: librgblibuniffi.so is not x86-64"; exit 1; }
          file lib/librgblibuniffi_arm64.so | grep -q "aarch64\|ARM aarch64" || { echo "ERROR: librgblibuniffi_arm64.so is not aarch64"; exit 1; }
          file lib/librgblibuniffi.dylib | grep -q "arm64\|aarch64" || { echo "ERROR: librgblibuniffi.dylib is not arm64"; exit 1; }
        shell: bash

      - name: Commit bindings, libraries and submodule pointer
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rgb_lib.go rgb_lib.h lib/ rgb-lib
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "Build Go bindings and native libs from rgb-lib@${{ needs.sub-meta.outputs.source_sha }}"
            git push origin HEAD:${{ needs.sub-meta.outputs.branch }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create and push tag
        run: |
          TAG="${{ needs.sub-meta.outputs.tag }}"
          git tag "$TAG" ${{ steps.commit.outputs.sha }}
          git push origin "refs/tags/$TAG"
        shell: bash
