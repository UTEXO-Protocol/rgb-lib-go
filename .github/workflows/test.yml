name: Test Library

on:
  # Trigger after the full release pipeline (including publish) completes
  workflow_run:
    workflows: ["Build and Release"]
    types:
      - completed
    branches:
      - 'release/*'

  # Manual trigger
  workflow_dispatch:
    inputs:
      bitcoin_network:
        description: 'Bitcoin network (signet, testnet, regtest)'
        required: false
        default: 'signet'
        type: string

  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'lib_test/**'
      - 'rgb_lib.go'
      - 'rgb_lib.h'

  # Run on PR
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Only run when the upstream build succeeded (not on failed runs)
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib_name: librgblibuniffi.so
          - os: macos-latest
            lib_name: librgblibuniffi.dylib

    steps:
      - name: Resolve branch to test
        id: meta
        run: |
          # On workflow_run: use the branch that triggered the build
          # Otherwise: use current branch
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.branch }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify native library is present
        run: |
          if [ ! -f "lib/${{ matrix.lib_name }}" ]; then
            echo "ERROR: lib/${{ matrix.lib_name }} not found — publish job may not have run yet"
            exit 1
          fi
          file lib/${{ matrix.lib_name }}

      - name: Build Go package
        run: |
          export CGO_ENABLED=1
          go mod tidy
          go build ./...

      - name: Use local rgb-lib-go for testing
        working-directory: lib_test
        run: |
          go mod edit -replace github.com/UTEXO-Protocol/rgb-lib-go=../
          go mod tidy

      - name: Run lib_test
        working-directory: lib_test
        env:
          BITCOIN_NETWORK: ${{ inputs.bitcoin_network || 'signet' }}
          MNEMONIC: ${{ secrets.TEST_MNEMONIC }}
          ACCOUNT_XPUB_VANILLA: ${{ secrets.TEST_ACCOUNT_XPUB_VANILLA }}
          ACCOUNT_XPUB_COLORED: ${{ secrets.TEST_ACCOUNT_XPUB_COLORED }}
          MASTER_FINGERPRINT: ${{ secrets.TEST_MASTER_FINGERPRINT }}
          INDEXER_URL: ${{ secrets.TEST_INDEXER_URL }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/lib
          CGO_ENABLED: 1
          CGO_LDFLAGS: -L${{ github.workspace }}/lib -lrgblibuniffi
        run: make run
